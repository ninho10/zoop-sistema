{% extends 'base.html' %}

{% block content %}
<div class="card">
    <h2>Cadastro de Produtos</h2>
    <form action="{{ url_for('add_product') }}" method="POST" enctype="multipart/form-data">
        <!-- Standard Fields -->
        <div class="form-group">
            <label>Fotos do Produto (Até 3 imagens)</label>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 15px; margin-top: 10px;">
                <div class="photo-upload-box" onclick="document.getElementById('photo1').click()">
                    <div class="upload-label">
                        <span class="upload-icon">📷</span>
                        <span style="font-size: 0.8rem; font-weight: 500;">Principal</span>
                    </div>
                    <input type="file" name="photo" id="photo1" accept="image/*" style="display: none;" onchange="previewImage(this, 'preview1')">
                    <img id="preview1" src="#" alt="Preview" style="display: none; width: 100%; height: 100%; object-fit: cover; border-radius: 8px; position: absolute; top: 0; left: 0; z-index: 2;">
                </div>
                <div class="photo-upload-box" onclick="document.getElementById('photo2').click()">
                    <div class="upload-label">
                        <span class="upload-icon">📷</span>
                        <span style="font-size: 0.8rem; font-weight: 500;">Foto 2</span>
                    </div>
                    <input type="file" name="photo2" id="photo2" accept="image/*" style="display: none;" onchange="previewImage(this, 'preview2')">
                    <img id="preview2" src="#" alt="Preview" style="display: none; width: 100%; height: 100%; object-fit: cover; border-radius: 8px; position: absolute; top: 0; left: 0; z-index: 2;">
                </div>
                <div class="photo-upload-box" onclick="document.getElementById('photo3').click()">
                    <div class="upload-label">
                        <span class="upload-icon">📷</span>
                        <span style="font-size: 0.8rem; font-weight: 500;">Foto 3</span>
                    </div>
                    <input type="file" name="photo3" id="photo3" accept="image/*" style="display: none;" onchange="previewImage(this, 'preview3')">
                    <img id="preview3" src="#" alt="Preview" style="display: none; width: 100%; height: 100%; object-fit: cover; border-radius: 8px; position: absolute; top: 0; left: 0; z-index: 2;">
                </div>
            </div>
        </div>

        <script>
            function previewImage(input, previewId) {
                var preview = document.getElementById(previewId);
                if (input.files && input.files[0]) {
                    var reader = new FileReader();
                    reader.onload = function(e) {
                        preview.src = e.target.result;
                        preview.style.display = 'block';
                    }
                    reader.readAsDataURL(input.files[0]);
                }
            }
        </script>
        
        <style>
            .photo-upload-box {
                position: relative;
                border: 2px dashed #dcdfe6;
                border-radius: var(--radius-md);
                background-color: #f8fafc;
                height: 120px;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: all var(--transition-normal);
                overflow: hidden;
                cursor: pointer;
            }
            .photo-upload-box:hover {
                border-color: var(--primary-blue);
                background-color: #f0f7ff;
            }
            .upload-label {
                display: flex;
                flex-direction: column;
                align-items: center;
                color: var(--text-muted);
                justify-content: center;
            }
            .upload-icon {
                font-size: 1.5rem;
                margin-bottom: 5px;
                opacity: 0.7;
            }
        </style>
        <div class="form-group">
            <label>Nome</label>
            <input type="text" name="name" required>
        </div>
        <div class="form-group">
            <label>Descrição</label>
            <textarea name="description"></textarea>
        </div>
        <div class="form-group">
            <label>Fabricante</label>
            <input type="text" name="manufacturer">
        </div>
        <div class="form-group">
            <label>Região</label>
            <input type="text" name="region">
        </div>
        <div class="form-group">
            <label>Quantidade Mínima</label>
            <input type="number" name="min_quantity">
        </div>
        <div class="form-group">
            <label>Preço</label>
            <div style="display: flex; gap: 10px;">
                <select name="currency" class="form-control" style="width: 100px;">
                    <option value="Real">R$</option>
                    <option value="Dolar">US$</option>
                    <option value="Euro">€</option>
                    <option value="Yuan">¥</option>
                </select>
                <input type="number" step="0.01" name="price" style="flex: 1;">
            </div>
        </div>

        <!-- Dynamic Fields -->
        {% if extra_columns %}
        <h3>Outras Informações</h3>
        {% for col in extra_columns %}
        <div class="form-group">
            <label>{{ col }}</label>
            <input type="text" name="{{ col }}">
        </div>
        {% endfor %}
        {% endif %}

        <button type="submit" class="btn btn-primary">Salvar Produto</button>
        <a href="{{ url_for('list_products') }}" class="btn btn-secondary">Ver Produtos</a>
    </form>
</div>
{% endblock %}
