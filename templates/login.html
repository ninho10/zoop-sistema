{% extends 'base.html' %}

{% block content %}
<div class="login-container">

    <!-- Login Form Container -->
    <div id="login-card" class="card">
        <h2>Login</h2>
        <form action="{{ url_for('login') }}" method="POST">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required>
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary">Entrar</button>
        </form>
        <div style="margin-top: 1rem; text-align: center;">
            <p>Não tem uma conta? <a href="#" onclick="toggleForms(event); return false;"
                    style="color: var(--primary-blue); font-weight: bold;">Cadastre-se</a></p>
        </div>
    </div>

    <!-- Signup Form Container (Hidden by default) -->
    <div id="signup-card" class="card" style="display: none;">
        <h2>Cadastro de Usuário</h2>
        <form action="{{ url_for('signup') }}" method="POST">
            <div class="form-group">
                <label>Nome</label>
                <input type="text" name="name" required>
            </div>
            <div class="form-group">
                <label>Empresa</label>
                <input type="text" name="company">
            </div>
            <div class="form-group">
                <label>Ramal</label>
                <input type="text" name="ramal">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required>
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-secondary">Cadastrar</button>
        </form>
        <div style="margin-top: 1rem; text-align: center;">
            <p>Já tem uma conta? <a href="#" onclick="toggleForms(event); return false;"
                    style="color: var(--primary-blue); font-weight: bold;">Fazer Login</a></p>
        </div>
    </div>

</div>

<script>
    function toggleForms(e) {
        e.preventDefault();
        var loginCard = document.getElementById('login-card');
        var signupCard = document.getElementById('signup-card');

        if (loginCard.style.display === 'none') {
            loginCard.style.display = 'block';
            signupCard.style.display = 'none';
        } else {
            loginCard.style.display = 'none';
            signupCard.style.display = 'block';
        }
    }
</script>
{% endblock %}
